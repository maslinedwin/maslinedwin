<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="340" viewBox="0 0 1500 340" role="img" aria-label="Nowah — AI travel that books">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#12181f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#00A86B" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#00A86B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00A86B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="18%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#C47A3A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C47A3A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="1500" height="340" fill="url(#bg)"/>
  <rect width="1500" height="340" fill="url(#glow)"/>
  <rect width="1500" height="340" fill="url(#warm)"/>

  <!-- left jade rail -->
  <rect x="0" y="0" width="5" height="340" fill="#00A86B"/>

  <!-- dotted flight arc -->
  <g fill="#00A86B" opacity="0.55">
    <circle cx="180" cy="250" r="2.2"/>
    <circle cx="240" cy="228" r="2"/>
    <circle cx="300" cy="208" r="2.2"/>
    <circle cx="360" cy="192" r="2"/>
    <circle cx="420" cy="180" r="2.2"/>
    <circle cx="480" cy="172" r="2"/>
    <circle cx="540" cy="168" r="2.4"/>
    <circle cx="600" cy="168" r="2"/>
    <circle cx="660" cy="172" r="2.2"/>
    <circle cx="720" cy="182" r="2"/>
    <circle cx="780" cy="196" r="2.2"/>
    <circle cx="840" cy="214" r="2"/>
    <circle cx="900" cy="236" r="2.2"/>
    <circle cx="960" cy="258" r="2"/>
    <circle cx="1020" cy="278" r="2.2"/>
  </g>
  <!-- plane mark -->
  <path d="M1035 275 L1060 282 L1035 289 L1040 282 Z" fill="#1FD08A" opacity="0.95"/>

  <!-- wordmark -->
  <text x="72" y="148" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="6" fill="#E6EDF3">NOWAH</text>
  <rect x="72" y="164" width="56" height="4" rx="2" fill="#00A86B"/>
  <text x="72" y="210" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#8B949E">AI travel that books</text>
  <text x="72" y="250" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6E7681">Maslin Edwin  ·  Founder  ·  Singapore</text>

  <!-- monogram -->
  <circle cx="1320" cy="170" r="56" fill="none" stroke="#00A86B" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="1320" cy="170" r="44" fill="none" stroke="#00A86B" stroke-opacity="0.22" stroke-width="1"/>
  <text x="1320" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#00A86B">N</text>

  <!-- bottom hairline -->
  <rect x="0" y="337" width="1500" height="3" fill="#00A86B" opacity="0.85"/>
</svg>
